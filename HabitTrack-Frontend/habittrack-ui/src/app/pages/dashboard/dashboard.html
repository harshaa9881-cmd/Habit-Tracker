<div class="dashboard-page">

  <nav class="navbar bg-white shadow-sm px-4 py-3">
    <span class="navbar-brand fw-bold">
      <i class="bi bi-activity text-primary me-2"></i>
      HabitTrack
    </span>

    <button class="btn btn-outline-secondary" (click)="logout()">
      <i class="bi bi-box-arrow-right me-2"></i>
      Logout
    </button>
  </nav>

  <main class="container py-5">

    <div class="dashboard-welcome">

      <span class="welcome-label">YOUR PERSONAL SPACE</span>

      <h1>Welcome, {{ userName }}!</h1>

      <p>
        Every small action brings you closer to your goals.
      </p>

      <div class="dashboard-placeholder">
        <i class="bi bi-stars"></i>

        <h3>Your habit journey starts here.</h3>

        <p>
          Your personalized habit dashboard will be available
          in our next development milestone.
        </p>
      </div>

    </div>

  </main>

</div>
